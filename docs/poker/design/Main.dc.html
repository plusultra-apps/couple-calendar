<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인디언 포커 로비</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D94C7E}a:hover{color:#B23A64}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; background: radial-gradient(ellipse 120% 55% at 50% 32%, #FFFFFF 0%, #FFF4F8 70%); color: #4B3A4F; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 52px">
    <button type="button" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(75,58,79,0.08); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#4B3A4F" style="stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5 L8 12 L15 19"></path></g></svg>
    </button>
    <button type="button" aria-label="규칙 보기" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(75,58,79,0.08); display: flex; align-items: center; justify-content: center; padding: 0; font-family: Jua, sans-serif; font-size: 20px; color: #4B3A4F">?</button>
  </div>

  <svg width="350" height="270" viewBox="0 0 350 270" role="img" aria-label="곰과 토끼가 이마에 카드를 붙이고 술상 앞에 마주 앉아 있다" style="margin-top: 8px">
    <ellipse cx="175" cy="248" rx="168" ry="20" fill="#FBE1EA"></ellipse>
    <g transform="translate(-4 44) scale(0.86)">
      <circle cx="50" cy="92" r="22" fill="#A7C7E7"></circle>
      <circle cx="50" cy="92" r="11" fill="#FFFFFF" opacity="0.5"></circle>
      <circle cx="150" cy="92" r="22" fill="#A7C7E7"></circle>
      <circle cx="150" cy="92" r="11" fill="#FFFFFF" opacity="0.5"></circle>
      <ellipse cx="100" cy="148" rx="74" ry="64" fill="#A7C7E7"></ellipse>
      <ellipse cx="74" cy="118" rx="18" ry="10" fill="#FFFFFF" opacity="0.35"></ellipse>
      <ellipse cx="100" cy="170" rx="26" ry="18" fill="#FFFFFF" opacity="0.55"></ellipse>
      <ellipse cx="100" cy="162" rx="7" ry="5" fill="#4B3A4F"></ellipse>
      <circle cx="72" cy="146" r="6" fill="#4B3A4F"></circle>
      <circle cx="128" cy="146" r="6" fill="#4B3A4F"></circle>
      <circle cx="74" cy="144" r="2" fill="#FFFFFF"></circle>
      <circle cx="130" cy="144" r="2" fill="#FFFFFF"></circle>
      <ellipse cx="56" cy="168" rx="11" ry="6" fill="#FF8DB3" opacity="0.5"></ellipse>
      <ellipse cx="144" cy="168" rx="11" ry="6" fill="#FF8DB3" opacity="0.5"></ellipse>
      <g fill="none" stroke="#4B3A4F" style="stroke-width: 3; stroke-linecap: round"><path d="M92 174 Q100 180 108 174"></path></g>
      <g transform="rotate(-6 100 92)">
        <rect x="74" y="54" width="52" height="72" rx="10" fill="#FF8DB3" stroke="#4B3A4F" style="stroke-width: 3"></rect>
        <rect x="81" y="61" width="38" height="58" rx="6" fill="none" stroke="#FFFFFF" opacity="0.7" style="stroke-width: 2; stroke-dasharray: 4 3"></rect>
        <text x="100" y="102" fill="#FFFFFF" style="font-family: Jua, sans-serif; font-size: 34px; text-anchor: middle">?</text>
      </g>
    </g>
    <g transform="translate(182 44) scale(0.86)">
      <ellipse cx="66" cy="62" rx="18" ry="46" fill="#F8B4C4" transform="rotate(-12 66 62)"></ellipse>
      <ellipse cx="66" cy="64" rx="8" ry="30" fill="#FFFFFF" opacity="0.55" transform="rotate(-12 66 64)"></ellipse>
      <ellipse cx="134" cy="62" rx="18" ry="46" fill="#F8B4C4" transform="rotate(12 134 62)"></ellipse>
      <ellipse cx="134" cy="64" rx="8" ry="30" fill="#FFFFFF" opacity="0.55" transform="rotate(12 134 64)"></ellipse>
      <ellipse cx="100" cy="150" rx="72" ry="62" fill="#F8B4C4"></ellipse>
      <ellipse cx="76" cy="120" rx="18" ry="10" fill="#FFFFFF" opacity="0.35"></ellipse>
      <g fill="none" stroke="#4B3A4F" style="stroke-width: 3.5; stroke-linecap: round">
        <path d="M66 148 Q74 140 82 148"></path>
        <path d="M118 148 Q126 140 134 148"></path>
        <path d="M90 168 Q100 176 110 168"></path>
      </g>
      <ellipse cx="100" cy="160" rx="4" ry="3" fill="#D94C7E"></ellipse>
      <ellipse cx="60" cy="166" rx="11" ry="6" fill="#FF6F9C" opacity="0.45"></ellipse>
      <ellipse cx="140" cy="166" rx="11" ry="6" fill="#FF6F9C" opacity="0.45"></ellipse>
      <g transform="rotate(6 100 96)">
        <rect x="74" y="58" width="52" height="72" rx="10" fill="#FFFFFF" stroke="#4B3A4F" style="stroke-width: 3"></rect>
        <text x="100" y="106" fill="#8A5C0E" style="font-family: Jua, sans-serif; font-size: 32px; text-anchor: middle">17</text>
      </g>
    </g>
    <g transform="translate(150 106)">
      <rect x="18" y="0" width="14" height="12" rx="3" fill="#4FB383"></rect>
      <g stroke="#4B3A4F" style="stroke-width: 3; stroke-linejoin: round">
        <path d="M17 12 H33 V26 Q46 34 46 52 V118 Q46 128 36 128 H14 Q4 128 4 118 V52 Q4 34 17 26 Z" fill="#B5E8CB"></path>
      </g>
      <rect x="10" y="66" width="30" height="34" rx="6" fill="#FFFFFF"></rect>
      <text x="25" y="89" fill="#2F7A57" style="font-family: Jua, sans-serif; font-size: 13px; text-anchor: middle">몽글</text>
      <rect x="11" y="38" width="5" height="22" rx="2.5" fill="#FFFFFF" opacity="0.6"></rect>
    </g>
  </svg>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px">
    <h1 style="margin: 0; font-family: Jua, sans-serif; font-weight: 400; font-size: 34px; line-height: 1.1">몽글 인디언 포커</h1>
    <p style="margin: 0; font-size: 14px; color: #7E6C85">내 카드는 나만 몰라요. 표정으로 승부!</p>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 18px">
    <span style="display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #E4F6EC; font-size: 13px; font-weight: 700; color: #24563F">
      <span style="position: relative; width: 28px; height: 28px">
        <span style="display: flex; align-items: flex-end; justify-content: center; width: 28px; height: 28px; box-sizing: border-box; border-radius: 999px; border: 2px solid #F8B4C4; background: #E9DDE3; overflow: hidden">
          <svg width="24" height="21" viewBox="0 0 38 34" role="img" aria-label="토끼 프로필 사진 자리"><circle cx="19" cy="13" r="8" fill="#BFAAB6"></circle><path d="M3 34 Q3 22 19 22 Q35 22 35 34 Z" fill="#BFAAB6"></path></svg>
        </span>
        <span style="position: absolute; right: -2px; bottom: -1px; width: 9px; height: 9px; border-radius: 999px; background: #4FB383; box-shadow: 0 0 0 2px #E4F6EC"></span>
      </span>
      토끼 대기 중
    </span>
    <span style="padding: 7px 12px; border-radius: 999px; background: rgba(75,58,79,0.06); font-size: 13px; color: #5E4C63">오늘 곰 1¼잔 · 토끼 2잔</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
    <button type="button" onClick="{{ openRules }}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; border: 0; background: #FFFFFF; box-shadow: 0 0 0 2px #F0D3DD; color: #4B3A4F; text-align: left">
      <span style="font-family: Jua, sans-serif; font-size: 16px">오늘의 룰</span>
      <span style="flex: 1; font-size: 13px; color: #7E6C85">{{ summary }}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#7E6C85" style="stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5 L16 12 L9 19"></path></g></svg>
    </button>
    <a href="Game.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 18px; background: #D94C7E; box-shadow: 0 5px 0 #B23A64; color: #FFFFFF; text-decoration: none; font-family: Jua, sans-serif; font-size: 24px">게임 시작</a>
    <button type="button" style="height: 44px; border: 0; background: transparent; color: #7E6C85; font-family: Jua, sans-serif; font-size: 16px">토끼 부르기</button>
  </div>

  <sc-if value="{{ rulesOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(59,46,63,0.5); display: flex; align-items: flex-end">
      <div style="width: 100%; box-sizing: border-box; padding: 12px 20px 28px; border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
        <span style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #F0D3DD"></span>
        <h2 style="margin: 0; font-family: Jua, sans-serif; font-weight: 400; font-size: 22px">오늘의 룰</h2>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 700; color: #7E6C85">기본 판돈</span>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{ baseOpts }}" as="o" hint-placeholder-count="2">
              <button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 700; color: #7E6C85">최대 판돈</span>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{ maxOpts }}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 700; color: #7E6C85">물 한 잔 타임</span>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{ waterOpts }}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>
        <p style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #FFF4F8; font-size: 13px; line-height: 1.6; color: #5E4C63">덱 1~20 + 조커 · 20이나 조커 들고 다이하면 2배<br>아이템: 엿보기 1회 · 반잔 원샷권 1장</p>
        <button type="button" onClick="{{ closeRules }}" style="height: 56px; border-radius: 18px; border: 0; background: #D94C7E; box-shadow: 0 5px 0 #B23A64; color: #FFFFFF; font-family: Jua, sans-serif; font-size: 22px">좋아요</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // 단위: 1 = ¼잔
    this.state = { base: 1, max: 4, water: 8, rulesOpen: false };
  }
  glass(q) {
    var whole = Math.floor(q / 4);
    var frac = ['', '¼', '½', '¾'][q % 4];
    return (whole === 0 ? frac : whole + frac) + '잔';
  }
  chips(key, values, unit) {
    var self = this;
    return values.map(function (v) {
      var on = self.state[key] === v;
      var base = 'flex: 1; height: 44px; border-radius: 14px; border: 0; font-family: Jua, sans-serif; font-size: 16px; padding: 0; ';
      return {
        label: self.glass(v) + unit,
        pick: function () { var s = {}; s[key] = v; self.setState(s); },
        style: on
          ? base + 'background: #4B3A4F; color: #FFFFFF;'
          : base + 'background: #FFF4F8; color: #4B3A4F; box-shadow: inset 0 0 0 2px #F0D3DD;'
      };
    });
  }
  renderVals() {
    var self = this;
    var s = this.state;
    return {
      summary: '기본 ' + this.glass(s.base) + ' · 최대 ' + this.glass(s.max) + ' · 물 ' + this.glass(s.water) + '마다',
      rulesOpen: s.rulesOpen,
      openRules: function () { self.setState({ rulesOpen: true }); },
      closeRules: function () { self.setState({ rulesOpen: false }); },
      baseOpts: this.chips('base', [1, 2], ''),
      maxOpts: this.chips('max', [2, 4, 6], ''),
      waterOpts: this.chips('water', [4, 8, 12], '마다')
    };
  }
}
</script>
</body>
</html>
